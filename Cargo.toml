[package]
name = "reedline-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A privacy-conscious Reedline playground for asynchronous AI suffix and fill-in-the-middle completion"
license = "MIT"
repository = "https://github.com/ArtificialNotImbecile/reedline-ai"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
nu-ansi-term = "0.50"
reedline = "=0.52.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
