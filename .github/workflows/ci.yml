name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (offline mock and localhost HTTP)
        run: cargo test --locked
      - name: Headless smoke test
        run: cargo run --locked -- --complete "git st"
      - name: Interactive PTY smoke test (Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/pty_smoke.py
