name: CI (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (offline mock and localhost HTTP)
        run: cargo test --locked
      - name: Headless smoke test
        run: cargo run --locked -- --complete "git st"
      - name: Interactive PTY smoke test (Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/pty_smoke.py
      - name: Native Bash adapter (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then brew install bash; fi
          python3 scripts/pty_bash_adapter.py
      - name: Windows PowerShell 5.1 transport and editor contract
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -File integrations/powershell/tests/Test-ReedlineAI.ps1 -Binary ./target/debug/reedline-ai.exe
      - name: PowerShell Core transport and editor contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -File integrations/powershell/tests/Test-ReedlineAI.ps1 -Binary ./target/debug/reedline-ai.exe
      - name: Adapter v1/v2 protocol contracts
        run: python3 tests/adapter_v2_contract.py
